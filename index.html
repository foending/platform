<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff7ed">
  <title>fønding</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #302923;
      --muted: #817266;
      --accent: #d87535;
      --accent-dark: #a94d19;
      --border: #e8d8c9;
      --glass: rgba(255,255,255,.65);
      --ease: cubic-bezier(.2,.75,.25,1);
    }
    * { box-sizing: border-box }
    body {
      margin: 0; min-height: 100svh; color: var(--ink);
      font-family: "Avenir Next", "Inter", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; font-synthesis: none;
      background: radial-gradient(ellipse at 90% 16%, #f8b97c75, transparent 40%),
        radial-gradient(ellipse at 10% 82%, #fbd1ac90, transparent 38%),
        radial-gradient(ellipse at 70% 95%, #eec7a044, transparent 55%),
        linear-gradient(123deg, #f9eee1, #fffaf4 52%, #f7e7d5);
      background-attachment: fixed;
    }
    button, input, select { font: inherit }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent }
    button, a, input, select { -webkit-tap-highlight-color: transparent }
    :focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 4px }
    button:disabled { opacity: .45; cursor: not-allowed }
    .stage { min-height: 100svh; display: grid; place-items: center; padding: 32px 18px }
    .shell {
      width: min(100%, 510px); min-height: min(668px, calc(100svh - 64px));
      position: relative; display: flex; flex-direction: column; padding: 34px 35px 29px;
      border: 1px solid #ffffffc4; border-radius: 34px;
      background: linear-gradient(140deg, #ffffffcf, #ffffff6b 60%, #ffecd35e);
      backdrop-filter: blur(28px) saturate(125%); -webkit-backdrop-filter: blur(28px) saturate(125%);
      box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #ffffff8a, 0 24px 80px #81522b19, 0 4px 14px #7c4d2510;
    }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 33px }
    .brand { font-size: 29px; font-weight: 800; letter-spacing: -1.8px; line-height: 1 }
    .brand span { color: var(--accent) }
    .header-action { display: flex; gap: 6px; align-items: center; border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px 0 }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 36px 0 12px }
    main.results-view { justify-content: flex-start; padding-top: 37px }
    .step { width: 100%; animation: arrive .36s var(--ease) both }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.99) } to { opacity: 1; transform: none } }
    h1 { font-size: clamp(29px, 6vw, 37px); line-height: 1.16; font-weight: 730; letter-spacing: -.05em; margin: 0 0 26px; text-wrap: balance }
    h1:focus { outline: none }
    h2 { font-size: 21px; line-height: 1.3; letter-spacing: -.025em; margin: 0 }
    p { margin: 0; line-height: 1.55 }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.55 }
    .icon { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 20px; height: 20px }
    .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
    .chevron { color: var(--accent); width: 19px; height: 19px }
    .choices { display: grid; gap: 10px }
    .choice, .field, .panel, .provider {
      width: 100%; background: linear-gradient(135deg, #ffffffca, #ffffff70); border: 1px solid #e7d6c8b3;
      border-radius: 17px; color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 4px 10px #8a583b06;
    }
    .choice, .provider { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 61px; text-align: left; padding: 15px 17px; font-size: 16px; font-weight: 600; transition: background .2s, transform .2s, border-color .2s, box-shadow .2s }
    .choice:hover, .provider:hover { transform: translateY(-2px); background: #fffffff0; border-color: #db9c70; box-shadow: 0 8px 19px #af713817 }
    .choice:active, .primary:active { transform: scale(.98) }
    .choice.selected { border-color: #d68c5d; background: #fff0df }
    .field { display: block; min-height: 59px; padding: 16px; font-size: 16px; font-weight: 500; outline: none; min-width: 0 }
    .field::placeholder { color: #a3988d; font-weight: 400 }
    .field:focus { border-color: #de985f; box-shadow: 0 0 0 4px #e49b5a18 }
    .primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 55px; border-radius: 16px; border: 1px solid #d28a56; color: #452415; background: linear-gradient(120deg, #ffc58e, #f8ab68 70%, #f19a57); box-shadow: 0 7px 20px #cd74322e, inset 0 1px 0 #ffffff90; font-size: 16px; font-weight: 670; padding: 14px 18px; transition: transform .2s, filter .2s }
    .primary:hover:not(:disabled) { filter: brightness(1.035); transform: translateY(-1px) }
    .stack { display: grid; gap: 11px }
    .nav { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 20px }
    .subtle, .back, .text-button { display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; padding: 7px 0; color: var(--muted); font-size: 14px; font-weight: 550 }
    .subtle:hover, .back:hover, .text-button:hover { color: var(--accent-dark) }
    .back .icon { width: 16px; height: 16px }
    .text-button { color: var(--accent-dark) }
    .search-box { position: relative }
    .search-box > .icon { position: absolute; top: 20px; left: 15px; color: var(--accent) }
    .search-box .field { padding-left: 45px }
    .suggestions { display: flex; gap: 7px; flex-wrap: wrap; margin: 13px 0 21px }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #e9d7c6; background: #ffffff80; border-radius: 99px; min-height: 34px; padding: 6px 11px; font-size: 12px; font-weight: 550; color: var(--muted); transition: color .2s, border-color .2s }
    .chip .icon { width: 13px; height: 13px; color: var(--accent) }
    .chip:hover { color: var(--accent-dark); border-color: #d88d57 }
    .loading-heading { margin-bottom: 8px }
    .query-label { margin-bottom: 27px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere }
    .loading-panel { padding: 20px; display: grid; gap: 19px }
    .loading-row { display: flex; align-items: center; gap: 11px; font-size: 14px; line-height: 1.4; color: #a3988c; transition: color .25s }
    .loading-row.complete, .loading-row.active { color: var(--ink) }
    .status-mark { width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 26px; border-radius: 50%; color: var(--accent-dark); background: #f5e6d8; transition: background .3s }
    .status-mark .icon { width: 15px; height: 15px }
    .loading-row.complete .status-mark { background: #fee2c5 }
    .loader { width: 16px; height: 16px; border: 2px solid #e1b798; border-right-color: #d87535; border-radius: 50%; animation: spin .8s linear infinite }
    .wait-dot { width: 6px; height: 6px; border-radius: 50%; background: #cdbbac }
    @keyframes spin { to { transform: rotate(360deg) } }
    .loading-track { height: 4px; margin-top: 4px; border-radius: 30px; background: #ecdccd; overflow: hidden }
    .loading-track span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f6b97c, #d87535); transition: width .72s var(--ease); border-radius: inherit }
    .program { padding: 20px; margin-bottom: 13px }
    .program-kicker { display: flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 660; color: var(--accent-dark); margin-bottom: 13px }
    .program-kicker .icon { width: 15px; height: 15px }
    .university { font-size: 14px; color: var(--muted); margin: 5px 0 18px }
    .details { display: grid; margin: 0; gap: 0; border-top: 1px solid #eadbcf }
    .details div { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 10px 0 0; font-size: 13px; line-height: 1.4 }
    .details dt { color: var(--muted) }
    .details dd { margin: 0; font-weight: 550 }
    .source { display: inline-flex; gap: 5px; align-items: center; margin-top: 13px; font-size: 12px; text-decoration: none; color: var(--accent-dark) }
    .source .icon { width: 13px; height: 13px }
    .source:hover { text-decoration: underline }
    .manual-label { font-size: 13px; font-weight: 650; display: grid; gap: 6px }
    .manual-label .field { min-height: 50px; font-size: 15px; padding: 12px }
    .results-title { margin-bottom: 9px }
    .result-context { margin: 0 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 13px }
    .result-context span { line-height: 1.45 }
    .result-context button { flex-shrink: 0; font-size: 13px }
    .fund-list { display: grid; gap: 9px }
    .fund { text-align: left; display: flex; align-items: center; gap: 12px; padding: 15px; transition: border-color .2s, transform .2s }
    .fund:hover { border-color: #dca172; transform: translateY(-1px) }
    .fund-info { flex: 1; min-width: 0; display: grid; gap: 6px }
    .fund-info strong { font-size: 15px; line-height: 1.35; font-weight: 650 }
    .fund-info span { font-size: 12px; color: var(--muted); line-height: 1.4 }
    .fund .icon { width: 18px; height: 18px; color: var(--accent) }
    .fund .saved-icon { color: var(--accent-dark) }
    .question-panel { padding: 17px; margin-top: 19px; background: linear-gradient(135deg,#fff9f1cc,#fff2e4a0) }
    .question-panel h2 { font-size: 17px; margin-bottom: 5px }
    .question-panel .hint { font-size: 12px; margin-bottom: 12px }
    .inline-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px }
    .inline-form .field { min-height: 43px; padding: 10px 12px; border-radius: 12px; font-size: 14px }
    .inline-form .primary { min-height: 43px; width: auto; padding: 10px 12px; border-radius: 12px; font-size: 13px }
    .detail-panel { padding: 20px; margin-bottom: 17px }
    .detail-panel h2 { font-size: 16px; margin-bottom: 10px }
    .detail-panel p { font-size: 14px; color: var(--muted) }
    .detail-panel p + h2 { margin-top: 19px }
    .secondary-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px; color: var(--ink); font-weight: 600; background: #ffffff80; border: 1px solid #e4d3c4; border-radius: 15px }
    .secondary-button .icon { color: var(--accent-dark) }
    .provider-mark { width: 34px; height: 34px; display: grid; place-items: center; color: var(--accent-dark); background: #f8e6d3; border-radius: 11px; font-weight: 800 }
    .provider-label { display: flex; gap: 12px; align-items: center }
    .sr-only { position: absolute; height: 1px; width: 1px; overflow: hidden; padding: 0; clip: rect(0,0,0,0); white-space: nowrap; border: 0 }
    @media (max-width: 560px) {
      .stage { display: flex; padding: 0; align-items: stretch }
      .shell { flex: 1; width: 100%; min-height: 100svh; padding: max(28px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom)); border: 0; border-radius: 0; background: linear-gradient(140deg,#ffffffb0,#fff4e758); box-shadow: none }
      main { padding: 27px 0 10px }
      main.results-view { padding-top: 32px }
    }
    @media (max-width: 350px) { .shell { padding-inline: 16px } .program { padding: 16px } .details div { grid-template-columns: 73px 1fr; gap: 7px } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="shell">
      <header><div class="brand">fønding<span>.</span></div><div id="header-action"></div></header>
      <main id="main"></main>
      <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script>
    // Static prototype. Program search, login and fund matching use only local fixture data.
    // No external search, authentication, uploads, analytics or persistent personal information.
    const programs = [
      {
        id: 'lse-misdi', title: 'MSc Management of Information Systems and Digital Innovation',
        school: 'London School of Economics and Political Science (LSE)', shortSchool: 'LSE',
        degree: 'Master (MSc)', level: 'master', field: 'Informasjonssystemer og digital innovasjon', subject: 'business', country: 'Storbritannia',
        source: 'https://www.lse.ac.uk/study-at-lse/graduate/msc-management-information-systems-and-digital-innovation'
      },
      {
        id: 'kcl-political-economy', title: 'Political Economy MA',
        school: 'King’s College London', shortSchool: 'King’s College London',
        degree: 'Master (MA)', level: 'master', field: 'Politisk økonomi', subject: 'society', country: 'Storbritannia',
        source: 'https://www.kcl.ac.uk/study/postgraduate-taught/courses/political-economy-ma'
      }
    ];
    const purposes = [['norway','Studier i Norge'],['abroad','Hel grad i utlandet'],['exchange','Utveksling'],['unsure','Vet ikke ennå']];
    const phases = ['Søker etter studieprogrammet…', 'Henter studieinformasjon…', 'Finner grad, fagområde og studieland…', 'Klargjør studiet ditt…'];
    const icons = {
      arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>', back:'<path d="M19 12H5m6 6-6-6 6-6"/>', check:'<path d="m5 12 4 4L19 6"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>', external:'<path d="M13 5h6v6m0-6-9 9"/><path d="M17 13v6H5V7h6"/>',
      bookmark:'<path d="M6 4h12v16l-6-4-6 4z"/>', user:'<circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>',
      edit:'<path d="m15 5 4 4M5 19l4-1 11-11-4-4L5 14z"/>'
    };
    const main = document.getElementById('main');
    const announce = document.getElementById('announcement');
    const headerAction = document.getElementById('header-action');
    const state = { screen:'purpose', purpose:'', query:'', found:null, program:null, connection:'', saved:new Set(), loggedIn:false, activeFund:null, pendingAction:null };
    let searchGeneration = 0;

    function el(tag, text, cls) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (cls) node.className = cls;
      return node;
    }
    function icon(name, cls='') {
      const node = el('span',undefined,'icon '+cls); node.setAttribute('aria-hidden','true');
      node.innerHTML = '<svg viewBox="0 0 24 24">'+icons[name]+'</svg>'; return node;
    }
    function btn(text, cls, action) {
      const node = el('button',text,cls); node.type='button'; node.addEventListener('click',action); return node;
    }
    function title(section, text, cls) { const h = el('h1',text,cls); h.tabIndex=-1; section.append(h); return h; }
    function nav(section, backAction, secondaryText, secondaryAction) {
      const row = el('div',undefined,'nav');
      const back = btn(undefined,'back',backAction); back.append(icon('back'),el('span','Tilbake')); row.append(back);
      if (secondaryText) row.append(btn(secondaryText,'subtle',secondaryAction));
      section.append(row);
    }
    function show(screen, focus=true) { if (state.screen==='searching' && screen!=='searching') searchGeneration++; state.screen=screen; render(focus); }
    function reset() {
      searchGeneration++;
      Object.assign(state,{screen:'purpose',purpose:'',query:'',found:null,program:null,connection:'',saved:new Set(),loggedIn:false,activeFund:null,pendingAction:null});
      render();
    }
    function updateHeader() {
      headerAction.replaceChildren();
      if (state.screen==='purpose') return;
      if (state.loggedIn) {
        const b=btn('Min side','header-action',()=>show('saved')); b.prepend(icon('user')); headerAction.append(b);
      } else if (['results','detail'].includes(state.screen)) {
        headerAction.append(btn('Logg inn','header-action',()=>{state.pendingAction={type:'browse',returnTo:state.screen};show('login');}));
      }
    }
    function render(focus=true) {
      updateHeader();
      const section=el('section',undefined,'step');
      main.classList.toggle('results-view',['results','saved'].includes(state.screen));
      const views={purpose:renderPurpose,study:renderStudy,searching:renderSearching,confirm:renderConfirm,notfound:renderNotFound,manual:renderManual,results:renderResults,detail:renderDetail,login:renderLogin,saved:renderSaved,application:renderApplication};
      views[state.screen](section);
      main.replaceChildren(section);
      if (focus) section.querySelector('h1')?.focus({preventScroll:true});
      window.scrollTo(0,0);
    }
    function renderPurpose(s) {
      title(s,'Hva trenger du støtte til?');
      const list=el('div',undefined,'choices');
      purposes.forEach(([key,label])=>{
        const option=btn(undefined,'choice'+(key===state.purpose?' selected':''),()=>{
          if(state.purpose!==key){state.program=null;state.query='';state.connection='';state.saved.clear();}
          state.purpose=key; show('study');
        });
        option.append(el('span',label),icon('arrow','chevron')); list.append(option);
      });
      s.append(list);
    }
    function renderStudy(s) {
      title(s,'Hva skal du studere?');
      const form=el('form',undefined,'stack');
      const wrap=el('div',undefined,'search-box');
      const input=el('input',undefined,'field'); input.type='search'; input.value=state.query; input.placeholder='Søk etter studiet ditt'; input.autocomplete='off'; input.maxLength=150; input.setAttribute('aria-label','Søk etter studieprogram');
      wrap.append(icon('search'),input);
      const submit=btn('Søk etter studiet','primary',()=>{}); submit.type='submit'; submit.disabled=!input.value.trim();
      input.addEventListener('input',()=>{submit.disabled=!input.value.trim();});
      form.addEventListener('submit',event=>{event.preventDefault(); if(input.value.trim()) startSearch(input.value);});
      form.append(wrap,submit); s.append(form);
      const suggestions=el('div',undefined,'suggestions');
      ['LSE MISDI','Political Economy på King’s'].forEach(query=>{
        const b=btn(query,'chip',()=>startSearch(query)); b.prepend(icon('search')); suggestions.append(b);
      });
      s.append(suggestions);
      nav(s,()=>show('purpose'),'Ikke bestemt meg ennå',()=>{state.program=null;show('results');});
    }
    function findProgram(query) {
      const q=query.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f’']/g,'').replace(/[^a-z0-9 ]/g,' ');
      if (/\bmisdi\b|\blse\b|london school of economics|management of information systems|digital innovation/.test(q)) return programs[0];
      if (/political economy|politisk okonomi|\bkcl\b|\bkings?\b/.test(q)) return programs[1];
      return null;
    }
    function startSearch(raw) {
      const query=raw.trim(); if(!query) return;
      state.query=query;state.found=null;state.phase=0;
      const generation=++searchGeneration; show('searching');
      [750,1600,2450].forEach((delay,index)=>setTimeout(()=>{
        if(generation!==searchGeneration||state.screen!=='searching')return;
        state.phase=index+1; updateLoading();
      },delay));
      setTimeout(()=>{
        if(generation!==searchGeneration||state.screen!=='searching')return;
        state.found=findProgram(query); show(state.found?'confirm':'notfound');
      },3150);
    }
    function renderSearching(s) {
      title(s,'Finner studiet ditt','loading-heading');
      s.append(el('p',state.query,'query-label'));
      const panel=el('div',undefined,'panel loading-panel'); panel.id='loading-panel';
      phases.forEach((message,i)=>{
        const row=el('div',undefined,'loading-row'); row.dataset.phase=i;
        row.append(el('span',undefined,'status-mark'),el('span',message)); panel.append(row);
      });
      const track=el('div',undefined,'loading-track'); track.setAttribute('aria-hidden','true'); track.append(el('span'));panel.append(track);s.append(panel);
      nav(s,()=>show('study'));
      paintLoading(panel);
    }
    function paintLoading(panel) {
      panel.querySelectorAll('.loading-row').forEach((row,i)=>{
        const status=row.firstElementChild;row.classList.toggle('complete',i<state.phase);row.classList.toggle('active',i===state.phase);
        status.replaceChildren(i<state.phase?icon('check'):el('span',undefined,i===state.phase?'loader':'wait-dot'));
      });
      panel.querySelector('.loading-track span').style.width=((state.phase+1)*23)+'%';
      announce.textContent=phases[state.phase];
    }
    function updateLoading(){const panel=document.getElementById('loading-panel');if(panel)paintLoading(panel);}
    function renderConfirm(s) {
      title(s,'Er dette studiet ditt?');
      const p=state.found;const card=el('article',undefined,'panel program');
      const kicker=el('div',undefined,'program-kicker');kicker.append(icon('check'),el('span','Studieprogram funnet'));
      card.append(kicker,el('h2',p.title),el('p',p.school,'university'));
      const details=el('dl',undefined,'details');
      [['Grad',p.degree],['Fagområde',p.field],['Land',p.country]].forEach(([label,value])=>{const row=el('div');row.append(el('dt',label),el('dd',value));details.append(row);});
      card.append(details);
      const source=el('a','Studieprogram hos '+p.shortSchool,'source'); source.href=p.source;source.target='_blank';source.rel='noopener noreferrer';source.append(icon('external'));card.append(source);
      s.append(card,btn('Ja, dette er studiet', 'primary',()=>{state.program=p;state.saved.clear();show('results');}));
      nav(s,()=>show('study'),'Legg inn manuelt',()=>show('manual'));
    }
    function renderNotFound(s) {
      title(s,'Vi fant ikke studiet');
      s.append(el('p','Prøv et annet søk, eller legg inn opplysningene selv.','hint'));
      const actions=el('div',undefined,'stack');actions.style.marginTop='22px';actions.append(btn('Søk på nytt','primary',()=>show('study')),btn('Legg inn manuelt','secondary-button',()=>show('manual')));s.append(actions);
      nav(s,()=>show('study'),'Hopp over',()=>{state.program=null;show('results');});
    }
    function renderManual(s) {
      title(s,'Fortell oss litt om studiet');
      const form=el('form',undefined,'stack');
      function label(text,input){const node=el('label',text,'manual-label');node.append(input);form.append(node);}
      function field(placeholder,value=''){const input=el('input',undefined,'field');input.placeholder=placeholder;input.value=value;input.maxLength=150;return input;}
      const name=field('Navn på studieprogram',state.query); name.required=true; label('Studieprogram',name);
      const degree=el('select',undefined,'field');
      [['','Velg grad'],['bachelor','Bachelor'],['master','Master'],['phd','Doktorgrad'],['other','Annet']].forEach(([value,text])=>{const option=el('option',text);option.value=value;degree.append(option);});label('Grad',degree);
      const subject=field('F.eks. økonomi og ledelse');label('Fagområde',subject);
      const country=field('Land',state.purpose==='norway'?'Norge':'');label('Studieland',country);
      const submit=btn('Fortsett','primary',()=>{});submit.type='submit';form.append(submit);
      form.addEventListener('submit',e=>{e.preventDefault();state.program={title:name.value.trim(),degree:degree.selectedOptions[0].value?degree.selectedOptions[0].textContent:'Uavklart',level:degree.value,field:subject.value.trim(),country:country.value.trim(),subject:/økonomi|ledelse|business|management/i.test(subject.value)?'business':'other'};state.saved.clear();show('results');});
      s.append(form);nav(s,()=>show('study'),'Hopp over',()=>{state.program=null;show('results');});
    }
    function funds() {
      // Illustrative potential matches, not determinations of eligibility or grants awarded.
      const p=state.program, abroad=['abroad','exchange'].includes(state.purpose), master=p?.level==='master', management=p?.subject==='business';
      const place=state.connection.toLowerCase(), result=[];
      const add=(id,name,reason,advice)=>result.push({id,name,reason,advice});
      if(abroad&&management) add('jansons','Jansons Legat','Utenlandsstudier · økonomi og ledelse','Vi ville undersøkt hvordan studiets faglige innhold kan knyttes til legatets formål og din videre karriere.');
      if(abroad&&(master||!p)) add('postgrad','Postgrad Solutions Study Bursary','Masterstudier i utlandet','Vi ville fremhevet studieplanen din og dokumentert finansieringsbehovet.');
      if(/asker|hurum|røyken/.test(place)) add('ciesielski','Adam Ciesielskis stiftelse','Geografisk tilknytning · utdanning','Vi ville dokumentert tilknytningen din til kommunen og forklart studieplanene.');
      if(/stavanger|rogaland|sandnes|suldal|haugesund/.test(place)&&abroad&&management) add('smedvig','Peder Smedvigs Stipendiefond','Utenlandsstudier · tilknytning til Rogaland','Vi ville undersøkt hvordan den geografiske tilknytningen og utdanningen passer legatets formål.');
      add('vogt','Else og Peter Vogts legat',p?'Høyere utdanning':'Utdanningsstøtte','Vi ville avklart de konkrete kvalifikasjonskravene og lagt vekt på den faglige begrunnelsen for utdanningen.');
      return result;
    }
    function renderResults(s) {
      title(s,'Mulige legater','results-title');
      const context=el('div',undefined,'result-context');
      context.append(el('span',state.program?`${state.program.shortSchool||state.program.title}${state.program.degree?' · '+state.program.degree:''}`:purposes.find(([key])=>key===state.purpose)?.[1]||'Studieplan'),btn('Endre','text-button',()=>show('study')));s.append(context);
      const list=el('div',undefined,'fund-list');
      funds().forEach(fund=>{
        const row=btn(undefined,'panel fund',()=>{state.activeFund=fund;show('detail');});
        const info=el('div',undefined,'fund-info');info.append(el('strong',fund.name),el('span',fund.reason));
        row.append(info,icon(state.saved.has(fund.id)?'bookmark':'arrow',state.saved.has(fund.id)?'saved-icon':'chevron'));list.append(row);
      });s.append(list);
      const question=el('section',undefined,'panel question-panel');
      question.append(el('h2','Hvor vokste du opp?'),el('p','Tilknytning til en kommune kan avklare flere legater.','hint'));
      const form=el('form',undefined,'inline-form');const input=el('input',undefined,'field');input.placeholder='Søk etter kommune';input.value=state.connection;input.setAttribute('aria-label','Oppvekstkommune');input.maxLength=100;
      const add=btn(state.connection?'Endre':'Legg til','primary',()=>{});add.type='submit';add.disabled=!input.value.trim();input.addEventListener('input',()=>{add.disabled=!input.value.trim();});
      form.addEventListener('submit',e=>{e.preventDefault();if(input.value.trim()){state.connection=input.value.trim();render(false);announce.textContent='Legatlisten er oppdatert';}});
      form.append(input,add);question.append(form);s.append(question);
      nav(s,()=>show('study'),'Start på nytt',reset);
    }
    function renderDetail(s) {
      const fund=state.activeFund; title(s,fund.name);
      const card=el('div',undefined,'panel detail-panel');
      card.append(el('h2','Hvorfor vi viser dette legatet'),el('p',fund.reason+'. Vi må avklare legatets fullstendige kriterier før du søker.'),el('h2','Slik kan vi vinkle søknaden'),el('p',fund.advice)); s.append(card);
      const actions=el('div',undefined,'stack');actions.append(btn('Forbered søknaden min','primary',()=>requireAccount('apply')));
      const save=btn(state.saved.has(fund.id)?'Lagret':'Lagre legat','secondary-button',()=>requireAccount('save'));save.prepend(icon(state.saved.has(fund.id)?'check':'bookmark'));save.disabled=state.saved.has(fund.id);actions.append(save);s.append(actions);nav(s,()=>show('results'));
    }
    function requireAccount(type){if(state.loggedIn){performAction(type);return;}state.pendingAction={type,returnTo:'detail'};show('login');}
    function performAction(type){if(type==='save'){state.saved.add(state.activeFund.id);show('detail');announce.textContent='Legatet er lagret';}else if(type==='apply'){show('application');}else{show(state.pendingAction?.returnTo||'results');}state.pendingAction=null;}
    function renderLogin(s) {
      title(s,'Logg inn');const list=el('div',undefined,'choices');
      [['Feide','F'],['BankID','B']].forEach(([provider,letter])=>{
        const option=btn(undefined,'provider',()=>{state.loggedIn=true;performAction(state.pendingAction?.type||'browse');});
        const label=el('span',undefined,'provider-label');label.append(el('span',letter,'provider-mark'),el('span','Logg inn med '+provider));option.append(label,icon('arrow','chevron'));list.append(option);
      });s.append(list);nav(s,()=>{const target=state.pendingAction?.returnTo||'results';state.pendingAction=null;show(target);});
    }
    function renderSaved(s){title(s,'Lagrede legater');const list=el('div',undefined,'fund-list');const items=funds().filter(f=>state.saved.has(f.id));items.forEach(fund=>{const b=btn(undefined,'panel fund',()=>{state.activeFund=fund;show('detail');});b.append(el('span',fund.name,'fund-info'),icon('arrow','chevron'));list.append(b);});s.append(list);if(!items.length)s.append(el('p','Du har ikke lagret noen legater ennå.','hint'));nav(s,()=>show('results'));}
    function renderApplication(s){title(s,'Forbered søknaden');const card=el('div',undefined,'panel detail-panel');card.append(el('h2',state.activeFund.name),el('p',state.activeFund.advice),el('h2','Neste steg'),el('p','Vi bruker opplysningene du allerede har gitt og avklarer hva vi trenger for en god søknad.'));s.append(card,btn('Til mine legater','primary',()=>{state.saved.add(state.activeFund.id);show('saved');}));nav(s,()=>show('detail'));}
    render(false);
  </script>
</body>
</html>
