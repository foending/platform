<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>fønding</title>
  <style>
    :root{color-scheme:light;--bg:#f2f1f6;--paper:#ffffffa8;--ink:#1c1924;--muted:#74717e;--line:#d8d5e4;--accent:#5635df;--soft:#e6defad6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 8% 13%,#e2def4 0%,transparent 62%),radial-gradient(ellipse at 92% 85%,#e8e3f7 0%,transparent 55%),var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .shell{max-width:488px;min-height:100svh;margin:auto;padding:36px 24px 32px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;min-height:32px;gap:24px}
    .brand{font-size:25px;font-weight:800;letter-spacing:-1.7px;line-height:1;color:var(--accent)}
    .progress{width:92px;height:4px;background:#cbc5df80;border-radius:8px;overflow:hidden}
    .progress>span{display:block;width:0%;height:100%;background:var(--accent);border-radius:8px;transition:width .25s ease}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 0 64px}
    .step{animation:appear .18s ease-out}
    @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    h1{font-size:clamp(30px,7vw,40px);letter-spacing:-1.55px;line-height:1.09;font-weight:700;margin:0 0 28px;max-width:420px;text-wrap:balance}
    h1:focus{outline:none}
    .choices{display:grid;gap:10px}
    .choice,.card{appearance:none;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%;min-height:60px;padding:17px 18px;border:1px solid #ffffffbf;border-radius:15px;background:linear-gradient(145deg,#ffffff9e,#ffffff55),var(--paper);color:var(--ink);font-size:16px;font-weight:550;transition:background .15s,border-color .15s,transform .15s;backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);box-shadow:inset 0 1px 1px #fff9,0 2px 12px #40326a08}
    .choice:hover,.card:hover{border-color:#8c76e4;background:#ffffffd9;transform:translateY(-1px)}
    .choice.selected{border-color:var(--accent);background:var(--soft)}
    .chevron{color:var(--accent);font-size:19px;font-weight:400;line-height:1}
    .back,.secondary{background:none;border:0;color:var(--muted);padding:10px 0;font-size:14px;font-weight:500;align-self:flex-start}
    .back:hover,.secondary:hover{color:var(--accent)}
    .nav{min-height:38px;margin-top:20px}
    .field{width:100%;min-height:60px;border:1px solid #ffffffbf;border-radius:15px;padding:17px 18px;background:var(--paper);color:var(--ink);font-size:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 1px #fff9,0 2px 12px #40326a08}
    .field::placeholder{color:var(--muted)}
    .primary{width:100%;border:1px solid #7b60ec;border-radius:15px;background:linear-gradient(145deg,#7354ed,var(--accent));color:white;padding:17px 18px;min-height:57px;font-weight:650;margin-top:12px;box-shadow:inset 0 1px 1px #ffffff30,0 3px 12px #5635df22}
    .primary:disabled{opacity:.45;cursor:not-allowed}
    .primary:not(:disabled):hover{background:#4829ca}
    .hint{font-size:14px;line-height:1.5;color:var(--muted);margin:-15px 0 22px}
    .form-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .card{display:block}
    .card-title{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:650;gap:12px}
    .card-meta{font-size:14px;font-weight:400;color:var(--muted);margin-top:7px;line-height:1.4}
    .detail{padding:20px;background:var(--paper);border:1px solid #ffffffbf;border-radius:15px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 1px #fff9,0 2px 12px #40326a08}
    .detail h2{font-size:16px;margin:0 0 8px}
    .detail p{font-size:15px;line-height:1.55;margin:0;color:var(--muted)}
    @media(max-width:520px){.shell{padding:25px 22px 24px}main{justify-content:flex-start;padding-top:clamp(52px,13vh,110px)}.choice{min-height:58px}h1{margin-bottom:24px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">fønding</div>
      <div class="progress" id="progress" role="progressbar" aria-label="Fremdrift" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    </header>
    <main id="main"></main>
  </div>
  <script>
    // This prototype runs entirely in memory. It sends and stores no answers.
    const answers = {};
    const main = document.getElementById('main');
    const progress = document.getElementById('progress');
    let current = 'purpose';
    let activeExample = null;

    const questions = {
      purpose: { title:'Hva trenger du støtte til?', options:[['norway','Studier i Norge'],['abroad','Hele graden i utlandet'],['exchange','Utveksling'],['unsure','Vet ikke ennå']] },
      level: { title:'Hvilket nivå studerer du på?', options:[['bachelor','Bachelor'],['master','Master'],['phd','Doktorgrad'],['other','Annet']] },
      subject: { title:'Hva studerer du?', options:[['business','Økonomi og ledelse'],['tech','Teknologi og realfag'],['health','Helse og medisin'],['society','Samfunnsfag og jus'],['arts','Kunst og humaniora'],['other','Annet']] },
      country: { title:'I hvilket land skal du studere?', placeholder:'Skriv landet', type:'text' },
      connection: { title:'Hvor vokste du opp?', hint:'Noen legater støtter studenter fra bestemte kommuner.', placeholder:'Skriv kommunen', type:'text' }
    };

    function flow(){
      const steps=['purpose','level','subject'];
      if(['abroad','exchange'].includes(answers.purpose)) steps.push('country');
      return [...steps,'connection'];
    }
    function updateProgress(){
      const steps=flow();
      const position=steps.indexOf(current);
      const value=position<0?100:((position+1)/steps.length)*100;
      progress.firstElementChild.style.width=`${value}%`;
      progress.setAttribute('aria-valuenow',Math.round(value));
    }
    function make(tag,text,className){
      const el=document.createElement(tag);
      if(text!==undefined) el.textContent=text;
      if(className) el.className=className;
      return el;
    }
    function button(text,className,action){
      const el=make('button',text,className);
      el.type='button';el.addEventListener('click',action);return el;
    }
    function previous(){
      if(current==='detail'){current='results';render();return;}
      const steps=flow();
      if(current==='results'){current=steps[steps.length-1];render();return;}
      const pos=steps.indexOf(current);
      if(pos>0){current=steps[pos-1];render();}
    }
    function next(value){
      if(current==='purpose'&&answers.purpose!==value)delete answers.country;
      answers[current]=value;
      const steps=flow();
      current=steps[steps.indexOf(current)+1]||'results';
      render();
    }
    function reset(){
      Object.keys(answers).forEach(key=>delete answers[key]);
      current='purpose';activeExample=null;render();
    }
    function title(container,text){
      const el=make('h1',text);el.tabIndex=-1;container.append(el);return el;
    }
    function back(container){
      const row=make('div',undefined,'nav');row.append(button('← Tilbake','back',previous));container.append(row);
    }
    function examples(){
      const a=[];
      if(answers.purpose==='exchange')a.push({name:'Støtte til utveksling',reason:'For utvekslingsopphold',next:'Sjekk om lærestedet har en egen søknadsordning.'});
      if(answers.purpose==='abroad')a.push({name:'Støtte til utenlandsstudier',reason:'For en hel grad i utlandet',next:'Kontroller hvilke utdanninger og land ordningen dekker.'});
      if(answers.purpose==='norway')a.push({name:'Utdanningsstipend',reason:'For studier i Norge',next:'Sjekk krav til utdanningsnivå og dokumentasjon.'});
      a.push({name:'Legat for ditt fagområde',reason:'Basert på fagområdet ditt',next:'Kontroller fagkriteriene og hvilke vedlegg som kreves.'});
      if(answers.connection)a.push({name:'Lokalt utdanningslegat',reason:'Basert på geografisk tilknytning',next:'Sjekk hvilket krav legatet stiller til lokal tilknytning.'});
      return a;
    }
    function render(focus=true){
      updateProgress();
      const section=make('section',undefined,'step');
      let heading;
      if(current==='results'){
        heading=title(section,'Dine muligheter');
        section.append(make('p','Eksempelvisning. Legatdatabasen er ikke tilkoblet.','hint'));
        const list=make('div',undefined,'choices');
        examples().forEach(item=>{
          const card=button(undefined,'card',()=>{activeExample=item;current='detail';render();});
          const row=make('div',undefined,'card-title');row.append(make('span',item.name),make('span','›','chevron'));
          card.append(row,make('div',item.reason,'card-meta'));list.append(card);
        });
        section.append(list);back(section);
        section.append(button('Start på nytt','secondary',reset));
      }else if(current==='detail'){
        heading=title(section,activeExample.name);
        section.append(make('p','Eksempel på neste steg.','hint'));
        const detail=make('div',undefined,'detail');detail.append(make('h2','Slik søker du'),make('p',activeExample.next));section.append(detail);back(section);
      }else{
        const q=questions[current];
        heading=title(section,q.title);
        if(q.hint)section.append(make('p',q.hint,'hint'));
        if(q.options){
          const list=make('div',undefined,'choices');
          q.options.forEach(([value,label])=>{
            const selected=answers[current]===value;
            const option=button(undefined,'choice'+(selected?' selected':''),()=>next(value));
            option.append(make('span',label),make('span','›','chevron'));
            list.append(option);
          });
          section.append(list);
          if(current!=='purpose')back(section);
        }else{
          const form=make('form');
          const input=make('input',undefined,'field');
          input.type='text';input.placeholder=q.placeholder;input.value=answers[current]||'';input.autocomplete='off';input.maxLength=100;input.setAttribute('aria-label',q.title);
          const submit=button('Fortsett','primary',()=>{});submit.type='submit';submit.disabled=!input.value.trim();
          input.addEventListener('input',()=>{submit.disabled=!input.value.trim();});
          form.addEventListener('submit',event=>{event.preventDefault();if(input.value.trim())next(input.value.trim());});
          form.append(input,submit);section.append(form);
          const nav=make('div',undefined,'form-nav');nav.append(button('← Tilbake','back',previous),button('Hopp over','secondary',()=>next('')));section.append(nav);
        }
      }
      main.replaceChildren(section);
      if(focus)heading.focus({preventScroll:true});
    }
    render(false);
  </script>
</body>
</html>
